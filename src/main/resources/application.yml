spring:

  application:
    name: distributed-job-platform

  datasource:
    url: jdbc:postgresql://localhost:5432/job_platform
    username: postgres
    password: root

  jpa:
    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: true

    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:9092

server:
  port: 9090

logging:
  level:
    org.springframework.jdbc: INFO
    org.hibernate.SQL: DEBUG